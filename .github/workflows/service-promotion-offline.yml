name: Couple SERVICE promotion offline CI
on:
  push:
    branches:
      - 'release/couple-r2-h2-20261016-r1'
permissions:
  contents: read
jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
